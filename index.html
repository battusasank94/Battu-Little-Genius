<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7868e6">
<meta name="description" content="Battu Little Genius — a playful, offline-first learning world for little children.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Battu Little Genius</title>
<style>
:root{--ink:#332e57;--muted:#777394;--purple:#7868e6;--pink:#ff8eb5;--yellow:#ffd76b;--mint:#8de2c1;--sky:#8ed7f2;--paper:#fffdf8;--shadow:0 12px 28px #4e43831c}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(150deg,#f8f3ff,#eefaff 52%,#fff6ec);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:4px solid #302477;outline-offset:3px}
.app{max-width:1100px;margin:auto;padding:16px 18px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#ffda75,#ff9dbd);display:grid;place-items:center;font-size:31px;box-shadow:0 6px 0 #e6a3a5}
h1{font-size:clamp(20px,4vw,30px);margin:0;letter-spacing:-.7px}.tag{font-size:12px;color:var(--muted);margin-top:3px}
.langs{display:flex;gap:5px;background:#fff;padding:5px;border-radius:16px;box-shadow:var(--shadow)}.lang{padding:8px 10px;border-radius:11px;background:transparent;color:var(--muted);font-weight:800;font-size:13px}.lang.active{background:var(--purple);color:#fff}
.hero{background:linear-gradient(110deg,#8979f0,#b59af4 55%,#f4a9ca);border-radius:28px;padding:22px 24px;color:white;display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.hero h2{font-size:clamp(23px,4vw,34px);margin:0 0 7px}.hero p{margin:0;max-width:520px;line-height:1.45;color:#fff}.hero .mascot{font-size:clamp(70px,13vw,112px);filter:drop-shadow(0 8px 0 #5a47902b);transform:rotate(-7deg)}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.section-title h2{font-size:21px;margin:0}.section-title span{font-size:12px;color:var(--muted)}
.worlds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.world{min-height:170px;text-align:left;padding:17px;border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s}
.world:active{transform:translateY(3px)}.world .emoji{font-size:51px;display:block;margin-bottom:8px;filter:drop-shadow(0 5px 0 #3a2c2715)}.world strong{display:block;font-size:17px}.world small{display:block;margin-top:4px;color:#514d6d;font-size:12px;line-height:1.3}.world:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff38;right:-28px;top:-30px}
.w-house{background:#ffe0a3}.w-brain{background:#d8caff}.w-learn{background:#bdeafa}.w-create{background:#ffc9df}.w-chef{background:#c4f0d9}.w-animal{background:#d9edb0}
.footer{text-align:center;color:var(--muted);font-size:12px;margin:23px 0 0}
.panel{display:none;background:#fff;border-radius:26px;padding:20px;margin-top:18px;box-shadow:var(--shadow)}.panel.open{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.panel-head h2{margin:0;font-size:23px}.back{background:#f0edff;color:#6254c7;padding:10px 14px;border-radius:13px;font-weight:800}
.intro{color:var(--muted);margin:0 0 16px;line-height:1.5}.play-area{background:#f8f6ff;border-radius:20px;padding:17px;min-height:180px}.big-btn{background:var(--purple);color:white;padding:12px 17px;border-radius:14px;font-weight:800;margin:5px}.soft-btn{background:#fff;color:var(--ink);padding:11px 15px;border-radius:14px;font-weight:800;margin:5px;box-shadow:0 3px 0 #e6e2f3}.result{font-weight:800;color:#4e9b7d;min-height:25px;margin:10px 4px}
.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(55px,1fr));gap:9px;max-width:470px;margin:auto}.memory-card{height:76px;border-radius:16px;background:linear-gradient(145deg,#8978ee,#b6a6ff);color:white;font-size:30px;box-shadow:0 4px 0 #6655c7}.memory-card.revealed{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px #e9e3ff}.memory-card.matched{background:#c8f1dd;box-shadow:none}
.quiz-options{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0}.quiz-options button{min-width:72px;background:#fff;border-radius:17px;padding:13px 17px;font-size:22px;box-shadow:0 4px 0 #e5e0f1}
.room{height:245px;border-radius:18px;background:linear-gradient(#bceaff 0 62%,#b6e6b7 62%);position:relative;overflow:hidden;border:5px solid #fff}.room:before{content:"";position:absolute;left:8%;top:10%;width:80px;height:75px;background:#fff8b6;border:7px solid #fff;border-radius:12px;box-shadow:inset 0 0 0 2px #9bcde6}.room-items{position:absolute;inset:0;display:flex;align-items:end;justify-content:space-around;padding:15px;font-size:42px}
.food-row,.animal-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.food,.animal{background:#fff;border-radius:17px;padding:12px 15px;font-size:31px;box-shadow:0 4px 0 #e6e1f0}
canvas{width:100%;height:230px;background:#fff;border-radius:18px;touch-action:none;display:block;border:2px dashed #d9d2f5}
.colours{display:flex;gap:9px;justify-content:center;margin:12px}.colour{width:31px;height:31px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #ddd}
@media(max-width:650px){.app{padding:12px 12px 30px}.worlds{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.world{min-height:153px;padding:14px}.world .emoji{font-size:43px}.hero{padding:18px}.hero .mascot{font-size:70px}.langs{gap:1px}.lang{padding:8px 7px;font-size:12px}}

</style>
</head>

 <button class="world w-create" data-world="create"><span class="emoji">🎨</span><strong data-t="create">Creative World</strong><small data-d="create">Draw, colour and make art</small></button>
 <button class="world w-chef" data-world="chef"><span class="emoji">👩‍🍳</span><strong data-t="chef">Little Chef</strong><small data-d="chef">Make yummy pretend recipes</small></button>
 <button class="world w-animal" data-world="animal"><span class="emoji">🦁</span><strong data-t="animal">Animal World</strong><small data-d="animal">Meet animals and hear their names</small></button>
</main>
<section class="panel" id="panel" aria-live="polite">
 <div class="panel-head"><h2 id="panelTitle">Game</h2><button class="back" id="backBtn">← <span id="backText">Home</span></button></div>
 <p class="intro" id="panelIntro"></p><div class="play-area" id="playArea"></div><div class="result" id="result"></div>
</section>
<p class="footer" id="footerText">Made with love for curious little minds · No ads · No accounts · No payments</p>
</div>

function house(){shell('house','houseIntro');let a=$('playArea');a.innerHTML=`<div class="room"><div class="room-items" id="roomItems">🌳　🏠　🌼</div></div><div style="text-align:center;margin-top:12px"><button class="soft-btn" data-item="🛏️">${t('bed')}</button><button class="soft-btn" data-item="🛋️">${t('sofa')}</button><button class="soft-btn" data-item="🪴">${t('plant')}</button><button class="soft-btn" data-item="💡">${t('lamp')}</button><button class="soft-btn" data-item="🪑">${t('table')}</button><button class="soft-btn" data-item="🧸">${t('teddy')}</button><button class="big-btn" id="clearRoom">${t('clear')}</button></div>`;a.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{$('roomItems').textContent+=' '+b.dataset.item;say('Great choice!')});$('clearRoom').onclick=()=>{$('roomItems').textContent='🌳　🏠　🌼'}}
const deck=['🐶','🐱','🐸','🦋','🐼','🐰','🦁','🐵'];let first=null,lock=false,found=0;
function brain(){shell('brain','brainIntro');first=null;lock=false;found=0;let cards=[...deck.slice(0,6),...deck.slice(0,6)];for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}let a=$('playArea');a.innerHTML=`<div style="text-align:center;font-weight:800;margin-bottom:12px">${t('pairs')}: <span id="found">0</span>/6</div><div class="memory-grid" id="memory"></div><div style="text-align:center"><button class="soft-btn" id="restart">${t('clear')}</button></div>`;let grid=$('memory');cards.forEach((v,i)=>{let b=document.createElement('button');b.className='memory-card';b.textContent='❔';b.setAttribute('aria-label','Hidden memory card');b.setAttribute('aria-pressed','false');b.onclick=()=>{if(lock||b.classList.contains('revealed')||b.classList.contains('matched'))return;b.textContent=v;b.setAttribute('aria-label','Revealed memory card');b.setAttribute('aria-pressed','true');b.classList.add('revealed');if(!first){first=b;return}if(first.textContent===v){first.classList.add('matched');b.classList.add('matched');first.setAttribute('aria-label','Matched pair');b.setAttribute('aria-label','Matched pair');first=null;found++;$('found').textContent=found;if(found===6){$('result').textContent=t('correct');say(t('correct'))}}else{lock=true;let prev=first;first=null;mismatchTimer=setTimeout(()=>{if(prev.isConnected&&b.isConnected){prev.textContent='❔';b.textContent='❔';prev.setAttribute('aria-label','Hidden memory card');b.setAttribute('aria-label','Hidden memory card');prev.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','false');prev.classList.remove('revealed');b.classList.remove('revealed')}lock=false;mismatchTimer=null},850)}};grid.appendChild(b)});$('restart').onclick=brain}
const questions=[{q:'Which number comes after 3?',opts:['2','4','6'],ans:'4'},{q:'How many sides does a triangle have?',opts:['3','4','5'],ans:'3'},{q:'Which letter starts Apple?',opts:['B','A','C'],ans:'A'},{q:'What comes after 7?',opts:['8','5','2'],ans:'8'},{q:'Which shape is round?',opts:['□','△','○'],ans:'○'}];let qi=0;
function learn(){shell('learn','learnIntro');qi=0;drawQ()}
function drawQ(){let q=questions[qi%questions.length],a=$('playArea');a.innerHTML=`<div style="text-align:center"><div style="font-size:17px;font-weight:800;margin:10px">${q.q}</div><div class="quiz-options">${q.opts.map(x=>`<button data-answer="${x}">${x}</button>`).join('')}</div><button class="soft-btn" id="nextQ">${t('next')}</button></div>`;a.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(b.disabled)return;const ok=b.dataset.answer===q.ans;$('result').textContent=ok?t('correct'):t('tryAgain');if(ok){a.querySelectorAll('[data-answer]').forEach(option=>option.disabled=true);say(t('correct'))}});$('nextQ').onclick=()=>{qi++;$('result').textContent='';drawQ()}}
function create(){shell('create','createIntro');let a=$('playArea');a.innerHTML=`<canvas id="canvas" width="900" height="500" aria-label="Drawing area"></canvas><div class="colours">${['#ff6b8a','#ffbd45','#54c89a','#5aa9ed','#9b7bea','#332e57'].map(c=>`<button class="colour" style="background:${c}" data-colour="${c}" aria-label="Choose colour"></button>`).join('')}</div><div style="text-align:center"><button class="soft-btn" id="erase">${t('clear')}</button><button class="soft-btn" id="save">Save picture</button></div>`;$('result').textContent=t('drawHint');let c=$('canvas'),ctx=c.getContext('2d'),drawing=false,color='#ff6b8a';if(!ctx){$('result').textContent='Drawing is not supported in this browser.';return}ctx.lineWidth=12;ctx.lineCap='round';function pos(e){let r=c.getBoundingClientRect();if(!r.width||!r.height)return null;return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{let p=pos(e);if(!p)return;drawing=true;ctx.beginPath();ctx.moveTo(p.x,p.y);if(c.setPointerCapture)c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);if(!p)return;ctx.strokeStyle=color;ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false;a.querySelectorAll('[data-colour]').forEach(b=>b.onclick=()=>color=b.dataset.colour);$('erase').onclick=()=>ctx.clearRect(0,0,c.width,c.height);$('save').onclick=()=>{if(typeof c.toDataURL!=='function'){ $('result').textContent='Saving is not supported in this browser.';return }let link=document.createElement('a');link.download='my-little-genius-picture.png';link.href=c.toDataURL('image/png');link.click();$('result').textContent='Saved on your device!'}}
function chef(){shell('chef','chefIntro');let seq=['🍌','🍎','🍇'],labels=['Banana','Apple','Grapes'],step=0;let a=$('playArea');a.innerHTML=`<div style="font-size:18px;text-align:center;font-weight:800;margin-bottom:15px">🥣 Fruit salad bowl</div><div id="bowl" style="font-size:46px;text-align:center;min-height:65px">🥣</div><div class="food-row">${seq.map((x,i)=>`<button class="food" data-food="${i}" aria-label="${labels[i]}">${x}</button>`).join('')}</div><div style="text-align:center;margin-top:12px"><button class="soft-btn" id="resetChef">${t('clear')}</button></div>`;a.querySelectorAll('[data-food]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.food)!==step){$('result').textContent=t('tryAgain');return}step++;$('bowl').textContent='🥣 '+seq.slice(0,step).join(' ');$('result').textContent=step===3?t('done'):t('correct');if(step===3)say(t('done'))});$('resetChef').onclick=chef}
const animals=[['🐶','Dog','కుక్క','कुत्ता'],['🐱','Cat','పిల్లి','बिल्ली'],['🐘','Elephant','ఏనుగు','हाथी'],['🦁','Lion','సింహం','शेर'],['🐮','Cow','ఆవు','गाय'],['🐰','Rabbit','కుందేలు','खरगोश'],['🐵','Monkey','కోతి','बंदर'],['🦆','Duck','బాతు','बतख']];
function animal(){shell('animal','animalIntro');let a=$('playArea');a.innerHTML=`<div class="animal-row">${animals.map((x,i)=>`<button class="animal" data-animal="${i}" aria-label="${lang==='te'?x[2]:lang==='hi'?x[3]:x[1]}">${x[0]}</button>`).join('')}</div><div style="text-align:center;font-size:25px;font-weight:800;margin-top:18px" id="animalName">${t('animals')}</div><div style="text-align:center"><button class="soft-btn" id="repeat">${t('speak')}</button></div>`;let selected=animals[0];function show(i){selected=animals[i];$('animalName').textContent=lang==='te'?selected[2]:lang==='hi'?selected[3]:selected[1];say($('animalName').textContent)}a.querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>show(Number(b.dataset.animal)));$('repeat').onclick=()=>say($('animalName').textContent)}
if('serviceWorker'in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
setLang('en');
</script>
